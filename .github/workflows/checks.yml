name: Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild browser bundles
        run: node build.cjs
      - name: Check committed bundles
        run: git diff --exit-code -- extension/garmin-capture.bundle.js extension/garmin-panel.bundle.js
      - name: JavaScript tests
        run: node --test tests/*.test.cjs
      - name: SQLite importer tests
        run: python -m unittest discover -s tests -p 'test_*.py'
